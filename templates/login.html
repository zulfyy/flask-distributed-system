<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akarstack · Masuk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14181f; --paper:#f6f2e8; --paper-dim:#eae3d2; --paper-line:#ddd3ba;
    --scan:#f2a63b; --scan-strong:#d98a1f;
    --text-on-paper:#24211a; --text-on-paper-dim:#6b6558; --danger:#c65b4e; --ok:#5a9d6a;
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background: radial-gradient(circle at 15% 0%, rgba(242,166,59,0.08), transparent 45%), var(--ink);
    font-family:'Inter',system-ui,sans-serif;padding:20px;}
  .card{width:100%;max-width:380px;background:var(--paper);border-radius:14px;padding:32px;
    box-shadow:0 24px 60px -24px rgba(0,0,0,0.55);}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--scan-strong);margin:0 0 8px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 22px;color:var(--text-on-paper);}
  .tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--paper-dim);padding:4px;border-radius:9px;}
  .tab{flex:1;text-align:center;padding:8px;border-radius:6px;font-size:13px;font-weight:600;
    color:var(--text-on-paper-dim);text-decoration:none;}
  .tab.active{background:var(--paper);color:var(--text-on-paper);}
  form{display:none;flex-direction:column;gap:12px;}
  form.active{display:flex;}
  label{font-size:12px;color:var(--text-on-paper-dim);font-weight:500;}
  input{padding:11px 12px;border:1px solid var(--paper-line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--text-on-paper);width:100%;}
  input:focus{outline:2px solid var(--scan);outline-offset:1px;border-color:var(--scan);}
  button.submit{margin-top:6px;background:var(--scan);color:var(--ink);border:none;
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;padding:12px;
    border-radius:8px;cursor:pointer;}
  button.submit:hover{background:var(--scan-strong);}
  .flash-stack{margin-bottom:16px;display:flex;flex-direction:column;gap:8px;}
  .flash{font-size:13px;padding:10px 12px;border-radius:6px;background:rgba(242,166,59,0.1);
    border-left:3px solid var(--scan);color:var(--text-on-paper);}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Akarstack</p>
    <h1>{{ 'Masuk ke akun' if tab == 'login' else 'Buat akun baru' }}</h1>

    <div class="tabs">
      <a class="tab {{ 'active' if tab == 'login' else '' }}" href="{{ url_for('login', tab='login', next=next) }}">Login</a>
      <a class="tab {{ 'active' if tab == 'register' else '' }}" href="{{ url_for('login', tab='register', next=next) }}">Daftar</a>
    </div>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
    <div class="flash-stack">
      {% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}" class="{{ 'active' if tab == 'login' else '' }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="loginUsername">Username</label>
        <input id="loginUsername" name="username" type="text" required autocomplete="username">
      </div>
      <div>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="submit" type="submit">Masuk</button>
    </form>

    <form method="POST" action="{{ url_for('register') }}" class="{{ 'active' if tab == 'register' else '' }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="regUsername">Username</label>
        <input id="regUsername" name="username" type="text" required autocomplete="username">
      </div>
      <div>
        <label for="regPassword">Password</label>
        <input id="regPassword" name="password" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="submit" type="submit">Buat akun</button>
    </form>
  </div>
</body>
</html>
