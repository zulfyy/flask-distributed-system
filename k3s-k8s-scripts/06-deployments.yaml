# One Deployment per app, spread across BOTH worker nodes via podAntiAffinity (preferred).
# A single Service (see 05-services.yaml) round-robins across all pod replicas automatically.
# Resource limits set conservatively since traffic is 0-1 concurrent user.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: akarstack
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: auth } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: auth
          image: muhammadzulfy/akarstack-auth:latest
          ports: [{ containerPort: 5005 }]
          envFrom:
            - secretRef: { name: akarstack-app-env }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rembg
  namespace: akarstack
spec:
  replicas: 2
  selector:
    matchLabels: { app: rembg }
  template:
    metadata:
      labels: { app: rembg }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app: rembg } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: rembg
          image: muhammadzulfy/akarstack-rembg:latest
          ports: [{ containerPort: 5000 }]
          envFrom:
            - secretRef: { name: akarstack-app-env }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1800m",    memory: "4Gi" }
          volumeMounts:
            - { name: uploads, mountPath: /www/main/uploads }
            - { name: results, mountPath: /www/main/results }
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: pvc-uploads } }
        - { name: results, persistentVolumeClaim: { claimName: pvc-results } }
---
